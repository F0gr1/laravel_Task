services:
  assets:
    image: node:22-bookworm-slim
    profiles: ["assets"]
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run production"
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    restart: "no"

  app:
    build:
      context: .
      target: development
      args:
        INSTALL_DEV: "1"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(extension_loaded('pdo_mysql') ? 0 : 1);\""]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-task_manager}
      MYSQL_USER: ${DB_USERNAME:-task_manager}
      MYSQL_PASSWORD: ${DB_PASSWORD:-task_manager}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "${MAILPIT_HTTP_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8025/api/v1/info >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  node_modules:
  vendor:
